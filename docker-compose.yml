services:
  lucee:
    image: lucee/lucee:latest
    ports:
      - "8888:8888"
    volumes:
      - ./www:/var/www
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cfuser
      POSTGRES_PASSWORD: cfpass
      POSTGRES_DB: cfpractice
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
